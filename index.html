<!DOCTYPE html>
<html lang="zh-Hant" data-theme="morandi" data-time="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>生活軌跡 · v0.9.28</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --radius: 16px;
    --radius-sm: 12px;
    --shadow: 0 2px 16px rgba(74,69,62,0.05);
  }
  /* 暮色砂岩（預設） */
  [data-theme="morandi"] {
    --bg: #f3e9df; --bg2: #e7d6c6; --card: #fbf3ea;
    --ink: #524339; --ink2: #897564; --ink3: #bca696;
    --line: #ecdfd0; --line2: #e4d2c0;
    --accent: #c8906f; --accent2: #b8857a;
    --c-work: #9aa0b8; --c-study: #c2af8a; --c-exercise: #cb9a80;
    --c-chore: #a89c8e; --c-leisure: #94b0a4; --c-social: #c89aa4;
    --c-sleep: #a098b8; --c-spirit: #bc96aa; --c-travel: #aab588; --c-other: #c6bcae;
  }
  /* 晨霧玫瑰 */
  [data-theme="cream"] {
    --bg: #f7ebe9; --bg2: #f0dad9; --card: #fdf4f3;
    --ink: #5a4348; --ink2: #8c6f74; --ink3: #c4a8ac;
    --line: #f2dee0; --line2: #ecd0d2;
    --accent: #c98a96; --accent2: #b885a0;
    --c-work: #a8a4c0; --c-study: #d4b896; --c-exercise: #d49e88;
    --c-chore: #b0a498; --c-leisure: #9cbcb0; --c-social: #d4a0b4;
    --c-sleep: #a8a0c4; --c-spirit: #c4a0bc; --c-travel: #b4c094; --c-other: #ccc0b6;
  }
  /* 秋收麥浪 */
  [data-theme="gold"] {
    --bg: #f5edda; --bg2: #ebdcbc; --card: #fcf6e6;
    --ink: #534a34; --ink2: #877852; --ink3: #bcae88;
    --line: #ece0c4; --line2: #e6d6b6;
    --accent: #c0a052; --accent2: #b09058;
    --c-work: #a0a088; --c-study: #c8ac72; --c-exercise: #c49a72;
    --c-chore: #aaa080; --c-leisure: #9cae8e; --c-social: #c4a088;
    --c-sleep: #a8a088; --c-spirit: #bca088; --c-travel: #b0ac78; --c-other: #c4b896;
  }
  /* 月夜藍調 */
  [data-theme="night"] {
    --bg: #3c3e50; --bg2: #48495c; --card: #444658;
    --ink: #f0ece2; --ink2: #bcc0cc; --ink3: #8c909c;
    --line: #525468; --line2: #5a5c6e;
    --accent: #c9b486; --accent2: #a8aac0;
    --c-work: #969cba; --c-study: #cdb488; --c-exercise: #c89a84;
    --c-chore: #a098a6; --c-leisure: #8cb4aa; --c-social: #c89aac;
    --c-sleep: #9c94bc; --c-spirit: #b894b0; --c-travel: #a6b88a; --c-other: #a69eac;
  }
  body {
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 76px;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 16px; }
  header {
    padding: 20px 0 12px;
    text-align: center;
  }
  header h1 { font-size: 20px; letter-spacing: 1px; font-weight: 600; }
  header .ver { font-size: 11px; color: var(--ink3); letter-spacing: 1px; margin-top: 2px; }

  .live {
    background: var(--card);
    border-radius: 18px;
    padding: 16px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .live.active { border: 1.5px solid var(--accent); }
  .input-row { display: flex; gap: 8px; }
  .input-row input {
    flex: 1;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    outline: none;
  }
  .input-row input:focus { border-color: var(--accent); }
  .btn {
    border: none;
    border-radius: 12px;
    padding: 12px 18px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:active { opacity: 0.8; }
  .btn.ghost { background: var(--bg2); color: var(--ink2); }
  .btn.sm { padding: 8px 12px; font-size: 13px; }
  .running {
    margin-top: 12px;
    padding: 12px 14px;
    background: var(--bg);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .running .rtxt { font-size: 14px; line-height: 1.4; }
  .running .rtxt b { font-weight: 600; }
  .running .rmeta { font-size: 12px; color: var(--ink2); margin-top: 2px; }
  .timer { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--accent); font-weight: 600; }

  .tabbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(253,252,250,0.94);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    display: flex;
    z-index: 50;
  }
  .tabbar .tab {
    flex: 1;
    padding: 10px 0 14px;
    text-align: center;
    font-size: 11px;
    color: var(--ink3);
    cursor: pointer;
    border: none;
    background: none;
    font-family: inherit;
  }
  .tab .ic { font-size: 20px; display: block; margin-bottom: 2px; }
  .tab.on { color: var(--accent); }

  .view { display: none; }
  .view.on { display: block; }

  .sect-title { font-size: 13px; color: var(--ink2); margin: 18px 4px 8px; letter-spacing: 0.5px; }

  .day-head { font-size: 13px; color: var(--ink2); padding: 10px 4px 6px; font-weight: 600; }
  .entry {
    background: var(--card);
    border: 0.5px solid var(--line2);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 8px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .entry .body { flex: 1; min-width: 0; }
  .entry .t1 { font-size: 15px; line-height: 1.3; word-break: break-word; }
  .entry .t2 { font-size: 12px; color: var(--ink2); margin-top: 3px; }
  .entry .dur { font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .empty { text-align: center; color: var(--ink3); padding: 40px 20px; font-size: 14px; line-height: 1.8; }

  .cal-head { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 12px; }
  .cal-head .mo { font-size: 16px; font-weight: 600; }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
  .cal-grid .wd { text-align: center; font-size: 11px; color: var(--ink3); padding: 4px 0; }
  .cal-cell {
    aspect-ratio: 1;
    border-radius: 10px;
    background: var(--card);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 13px;
    cursor: pointer;
    position: relative;
    border: 1px solid transparent;
  }
  .cal-cell.blank { background: none; cursor: default; }
  .cal-cell.today { border-color: var(--accent); }
  .cal-cell.sel { background: var(--accent); color: #fff; }
  .cal-cell .bars { display: flex; gap: 2px; margin-top: 3px; height: 4px; }
  .cal-cell .bars i { width: 4px; height: 4px; border-radius: 50%; }
  .cal-moon { position: absolute; top: 2px; right: 3px; font-size: 9px; line-height: 1; opacity: 0.7; }
  .cal-cell.sel .cal-moon { opacity: 0.95; }

  .week-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .week-row .wlabel { width: 36px; font-size: 12px; color: var(--ink2); flex-shrink: 0; }
  .week-bar { flex: 1; height: 22px; border-radius: 6px; overflow: hidden; display: flex; background: var(--bg2); }
  .week-bar i { height: 100%; }

  .card2 { background: var(--card); border: 0.5px solid var(--line2); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .pie-wrap { display: flex; align-items: center; gap: 18px; }
  .legend { flex: 1; }
  .legend .lrow { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 6px; }
  .legend .lrow .ldot { width: 10px; height: 10px; border-radius: 3px; }
  .legend .lrow .lpct { margin-left: auto; color: var(--ink2); font-variant-numeric: tabular-nums; }
  .range-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .set-sub { font-size: 14px; margin-bottom: 4px; }
  .set-partner { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .set-pcard { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1.5px solid var(--line2); border-radius: 12px; padding: 10px 12px; font-family: inherit; cursor: pointer; position: relative; }
  .set-pcard.on { border-color: var(--accent); background: var(--bg); }
  .set-pemoji { font-size: 18px; }
  .set-pname { font-size: 14px; color: var(--ink); }
  .set-pbadge { position: absolute; top: -7px; right: 6px; font-size: 9px; background: var(--accent); color: #fff; padding: 1px 6px; border-radius: 20px; }
  .set-data { display: flex; gap: 8px; }
  .partner-change-hint { font-size: 13px; color: var(--ink3); text-align: center; margin-top: 16px; padding: 12px; background: var(--bg); border-radius: 12px; }
  .stat-fold { margin-top: 8px; }
  .stat-fold summary { font-size: 13px; color: var(--ink2); cursor: pointer; padding: 10px 0; list-style: none; display: flex; align-items: center; gap: 6px; }
  .stat-fold summary::-webkit-details-marker { display: none; }
  .stat-fold summary::before { content: '▸'; color: var(--ink3); transition: transform 0.2s; }
  .stat-fold[open] summary::before { transform: rotate(90deg); }
  /* 本週心情與時間（24小時時間軸） */
  .tl-faces { display: flex; padding-left: 22px; gap: 4px; margin-bottom: 4px; }
  .tl-face { flex: 1; text-align: center; font-size: 15px; }
  .tl-face.today { transform: scale(1.15); }
  .tl-chart { display: flex; height: 168px; }
  .tl-scale { display: flex; flex-direction: column; justify-content: space-between; width: 18px; font-size: 9px; color: var(--ink3); text-align: right; padding-right: 4px; }
  .tl-cols { flex: 1; display: flex; gap: 4px; }
  .tl-col { flex: 1; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .tl-track { position: relative; width: 64%; max-width: 20px; flex: 1; background: var(--bg); border-radius: 5px; overflow: hidden; }
  .tl-col.today .tl-track { box-shadow: 0 0 0 1.5px var(--accent); }
  .tl-track i { position: absolute; left: 0; right: 0; display: block; opacity: 0.85; }
  .tl-day { font-size: 11px; color: var(--ink3); margin-top: 6px; }
  .tl-col.today .tl-day { color: var(--accent); font-weight: 600; }
  .mw-legend { font-size: 11px; color: var(--ink3); line-height: 1.6; margin-top: 10px; padding-top: 8px; border-top: 0.5px solid var(--line); }
  /* 活躍時段 */
  .as-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .as-name { font-size: 12px; color: var(--ink2); width: 36px; }
  .as-track { flex: 1; height: 10px; background: var(--bg); border-radius: 6px; overflow: hidden; }
  .as-fill { height: 100%; background: var(--line2); border-radius: 6px; transition: width 0.4s ease; }
  .as-fill.top { background: var(--accent); }
  .as-n { font-size: 11px; color: var(--ink3); width: 18px; text-align: right; }
  .as-hint { font-size: 12px; color: var(--ink2); line-height: 1.7; margin-top: 10px; padding-top: 10px; border-top: 0.5px solid var(--line); }
  /* 本週月相 */
  .moon-row { display: flex; justify-content: space-between; gap: 4px; }
  .moon-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0; border-radius: 10px; }
  .moon-col.today { background: var(--bg); }
  .moon-g { font-size: 22px; }
  .moon-d { font-size: 11px; color: var(--ink3); }
  .moon-col.today .moon-d { color: var(--accent); font-weight: 600; }
  /* 本週提醒 */
  .insight { font-size: 14px; color: var(--ink2); line-height: 1.9; }
  .range-tabs button {
    flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); font-family: inherit; font-size: 13px; color: var(--ink2); cursor: pointer;
  }
  .range-tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }

  .goal {
    background: var(--card); border: 0.5px solid var(--line2); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px;
  }
  .goal .gtop { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .goal .gname { font-size: 15px; font-weight: 600; }
  .goal .gtype { font-size: 11px; color: var(--ink3); margin-top: 4px; }
  .goal .gval { font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
  .progress { height: 8px; background: var(--bg2); border-radius: 20px; margin-top: 10px; overflow: hidden; }
  .progress i { display: block; height: 100%; border-radius: 20px; background: var(--accent); transition: width 0.4s; }
  .goal.done .progress i { background: var(--accent); }
  .goal .gstreak { font-size: 11px; color: var(--accent); margin-top: 6px; }
  .goal .del { color: var(--ink3); font-size: 20px; cursor: pointer; background: none; border: none; line-height: 1; }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(58,54,49,0.4);
    display: none; align-items: flex-end; justify-content: center; z-index: 100;
  }
  .modal-bg.on { display: flex; }
  .onb-bg {
    position: fixed; inset: 0; background: var(--bg);
    display: none; align-items: center; justify-content: center; z-index: 200; padding: 24px;
  }
  .onb-bg.on { display: flex; }
  .onb-card { width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto; }
  .onb-progress { display: flex; gap: 6px; justify-content: center; margin-bottom: 22px; }
  .onb-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line2); transition: all 0.3s; }
  .onb-dot.on { background: var(--accent); width: 20px; border-radius: 4px; }
  .onb-h { font-size: 20px; font-weight: 600; color: var(--ink); text-align: center; margin-bottom: 8px; }
  .onb-sub { font-size: 13px; color: var(--ink3); text-align: center; line-height: 1.7; margin-bottom: 22px; }
  .onb-partners { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 22px; }
  .onb-partner { background: var(--card); border: 1.5px solid var(--line2); border-radius: 14px; padding: 14px 10px; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .onb-partner.on { border-color: var(--accent); background: var(--bg); }
  .onb-pemoji { font-size: 24px; }
  .onb-pname { font-size: 14px; font-weight: 600; color: var(--ink); }
  .onb-psub { font-size: 11px; color: var(--ink3); }
  .onb-themes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 22px; }
  .onb-theme { background: var(--card); border: 1.5px solid var(--line2); border-radius: 14px; padding: 14px; font-family: inherit; cursor: pointer; }
  .onb-theme.on { border-color: var(--accent); }
  .onb-sw { display: flex; gap: 4px; justify-content: center; margin-bottom: 8px; }
  .onb-sw i { width: 20px; height: 20px; border-radius: 50%; }
  .onb-tname { display: block; font-size: 13px; color: var(--ink); text-align: center; }
  .onb-cares { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 22px; }
  .onb-care { background: var(--card); border: 1.5px solid var(--line2); border-radius: 20px; padding: 9px 16px; font-family: inherit; font-size: 14px; color: var(--ink2); cursor: pointer; }
  .onb-care.on { border-color: var(--accent); color: var(--accent); }
  .onb-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .onb-skip { background: none; border: none; color: var(--ink3); font-family: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; }
  .modal {
    background: var(--card); border-radius: 22px 22px 0 0; padding: 22px 20px 32px;
    width: 100%; max-width: 480px; max-height: 86vh; overflow-y: auto;
  }
  .modal h3 { font-size: 17px; margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--ink2); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 13px; font-size: 15px; font-family: inherit; background: var(--card); color: var(--ink); outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .row2 { display: flex; gap: 10px; }
  .row2 > * { flex: 1; }
  .modal-btns { display: flex; gap: 10px; margin-top: 8px; }
  .modal-btns .btn { flex: 1; }
  .catpick { display: flex; flex-wrap: wrap; gap: 6px; }
  .catpick button {
    border: 1px solid var(--line); background: var(--card); border-radius: 20px;
    padding: 6px 12px; font-size: 13px; font-family: inherit; cursor: pointer; color: var(--ink2);
  }
  .catpick button.on { color: #fff; border-color: transparent; }
  .hint { font-size: 12px; color: var(--ink3); line-height: 1.6; margin-top: 4px; }
  .fab {
    position: fixed; right: 18px; bottom: 86px; width: 52px; height: 52px;
    border-radius: 50%; background: var(--accent); color: #fff; border: none;
    font-size: 26px; box-shadow: 0 6px 18px rgba(125,155,118,0.4); cursor: pointer; z-index: 40;
  }
  .summary-box { background: var(--bg); border-radius: 12px; padding: 14px; font-size: 13px; line-height: 1.9; color: var(--ink2); }
  .summary-box b { color: var(--ink); }
  .review-card { background: var(--card); border: 0.5px solid var(--line2); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 18px; }
  .review-row { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; margin-bottom: 12px; }
  .review-num { font-size: 20px; font-weight: 600; color: var(--accent); }
  .review-lbl { font-size: 11px; color: var(--ink3); margin-right: 4px; }
  .review-body { font-size: 14px; color: var(--ink); line-height: 1.7; }
  .review-warm { font-size: 13px; color: var(--ink2); line-height: 1.8; margin-top: 10px; padding-top: 10px; border-top: 0.5px solid var(--line); }
  .review-hint { background: var(--card); border: 0.5px solid var(--accent); border-radius: 14px; padding: 13px 16px; margin-bottom: 14px; cursor: pointer; box-shadow: var(--shadow); }
  .sched-add { display: flex; gap: 6px; margin-bottom: 10px; }
  .sched-time { width: 92px; border: 1px solid var(--line2); border-radius: 10px; padding: 8px; font-family: inherit; font-size: 13px; color: var(--ink); background: var(--card); }
  .sched-text { flex: 1; border: 1px solid var(--line2); border-radius: 10px; padding: 8px 12px; font-family: inherit; font-size: 13px; color: var(--ink); background: var(--card); outline: none; }
  .sched-text:focus { border-color: var(--accent); }
  .sched-list { display: flex; flex-direction: column; gap: 6px; }
  .sched-item { display: flex; align-items: center; gap: 10px; background: var(--bg); border-radius: 10px; padding: 8px 12px; }
  .sched-itime { font-size: 12px; color: var(--accent); min-width: 42px; }
  .sched-itext { flex: 1; font-size: 13px; color: var(--ink); }
  .sched-itext.done { color: var(--ink3); text-decoration: line-through; }
  .sched-del { background: none; border: none; color: var(--ink3); font-size: 17px; cursor: pointer; }
  .todo-card { background: var(--card); border: 0.5px solid var(--line2); border-radius: 14px; padding: 13px 15px; margin-bottom: 8px; box-shadow: var(--shadow); }
  .todo-card.due { border-color: var(--accent); border-width: 1.5px; }
  .todo-text { font-size: 14px; font-weight: 500; color: var(--ink); }
  .todo-time { font-size: 12px; color: var(--ink3); margin-top: 2px; }
  .todo-card.due .todo-time { color: var(--accent); }
  .todo-acts { display: flex; gap: 6px; margin-top: 10px; }
  .review-hint:active { opacity: 0.8; }
  .rh-title { font-size: 14px; font-weight: 600; color: var(--ink); }
  .rh-sub { font-size: 12px; color: var(--ink2); margin-top: 3px; }
  .estar { font-size: 17px; color: var(--ink3); cursor: pointer; padding: 0 4px; flex-shrink: 0; }
  .estar.on { color: var(--accent); }
  .keep-grp { font-size: 12px; color: var(--ink3); margin-bottom: 8px; }
  .keep-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; }
  .keep-star { color: var(--accent); font-size: 15px; }
  .keep-check { color: var(--accent); font-size: 15px; }

const KEYWORDS = {

  social:  ['聚','聚會','聚餐','吃飯','吃','約','約會','見面','碰面','聊天','閒聊','朋友','見朋友','家人','陪','陪伴','陪家人','陪小孩','約吃飯','喝酒','小酌','派對','party','慶生','生日','婚禮','喜宴','通話','講電話','打電話','視訊','line','傳訊息','聚聚','敘舊','社交','拜訪','探望','約咖啡','約飯','團聚'],

  spirit:  ['冥想','靜坐','靜心','正念','觀息','呼吸練習','身體掃描','五感覺察','覺察','瑜伽','瑜珈','瑜珈nidra','氣功','太極','寫日記','晨間日記','感恩日記','寫晨間日記','寫感恩','感恩練習','自我對話','跟自己對話','與自己對話','自我反思','自我覺察','自我關懷','情緒梳理','情緒整理','安頓情緒','釋放情緒','課題分離','設立界線','內在小孩','療癒','自我療癒','芳療','精油','泡澡','泡澡儀式','頌缽','聲音療癒','塔羅','占卜','抽牌','星座','占星','脈輪','能量','祈禱','許願','人類圖','儀式','心靈','靈性','身心靈','讀心靈書','心靈書','靈性書','心靈課','身心靈課','心靈成長','靈性成長','自我成長','潛能開發','工作坊','心理諮商','諮商'],

};
function autoClassify(text){
  const t = text.toLowerCase();
  const learned = state.learned[t];
  if(learned) return learned;
  let best = 'other', bestScore = 0, bestLongest = 0;
  for(const cat in KEYWORDS){
    let s = 0, longest = 0;
    for(const w of KEYWORDS[cat]){
      if(t.includes(w.toLowerCase())){ s += w.length; if(w.length>longest) longest = w.length; }
    }
    // 先比「最長命中詞」，平手再比總分，讓精準的長詞優先決定分類
    if(longest > bestLongest || (longest === bestLongest && s > bestScore)){
      bestLongest = longest; bestScore = s; best = cat;
    }
  }
  return best;
}

let state = loadState();
function loadState(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ const s = JSON.parse(raw); s.entries=s.entries||[]; s.goals=s.goals||[]; s.running=s.running||null; s.learned=s.learned||{}; s.plans=s.plans||[]; s.partner=s.partner||null; s.schedules=s.schedules||[]; s.onboarded=s.onboarded||false; s.todayState=s.todayState||null; return s; }
  } catch(e){}
  return { entries: [], goals: [], running: null, learned: {}, plans: [], partner: null, schedules: [], onboarded: false, todayState: null };
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

const pad = n => String(n).padStart(2,'0');
function fmtTime(ts){ const d=new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtDur(ms){
  const m = Math.round(ms/60000);
  if(m<60) return m+' 分';
  const h=Math.floor(m/60), mm=m%60;
  return mm? h+' 時 '+mm+' 分' : h+' 小時';
}
function dateKey(ts){ const d=new Date(ts); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function localDT(ts){ const d=new Date(ts); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); }
function startOfWeek(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setHours(0,0,0,0); x.setDate(x.getDate()-day); return x; }

const $ = id => document.getElementById(id);
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderRunning(){
  const slot = $('runningSlot');
  const live = $('liveBox');
  if(state.running){
    live.classList.add('active');
    const cat = catById(state.running.cat);
    slot.innerHTML = '<div class="running"><div>'+
      '<div class="rtxt"><b>'+esc(state.running.text)+'</b></div>'+
      '<div class="rmeta"><span style="color:'+cat.hex+';font-weight:600">'+cat.name+'</span> · 開始 '+fmtTime(state.running.start)+' · <span class="timer" id="liveTimer"></span></div>'+
      '</div><button class="btn sm" id="endBtn">結束</button></div>';
    $('endBtn').onclick = endRunning;
    tickTimer();
  } else {
    live.classList.remove('active');
    slot.innerHTML = '';
  }
}
let timerInt = null;
function tickTimer(){
  if(timerInt) clearInterval(timerInt);
  const upd = ()=>{ const el=$('liveTimer'); if(el && state.running) el.textContent='已過 '+fmtDur(Date.now()-state.running.start); };
  upd(); timerInt = setInterval(upd, 30000);
}
function startRunning(){
  const input = $('entryInput');
  const text = input.value.trim();
  if(!text) return;
  if(state.running) endRunning();
  const cat = autoClassify(text);
  state.running = { text, start: Date.now(), cat };
  input.value=''; save(); renderRunning();
  showCompanionReply(buildReply(cat));
}
// 從預先排程直接開始記錄
function startFromSchedule(sid){
  const s=(state.schedules||[]).find(x=>x.id===sid); if(!s) return;
  if(state.running) endRunning();
  const cat = autoClassify(s.text);
  state.running = { text: s.text, start: Date.now(), cat };
  s.done = true; // 標記已開始
  save(); renderRunning(); renderToday();
  showCompanionReply(buildReply(cat));
  switchView('today');
}
function endRunning(){
  if(!state.running) return;
  const r = state.running;
  state.entries.push({
    id: 'e'+Date.now()+Math.random().toString(36).slice(2,6),
    text: r.text, cat: r.cat, start: r.start, end: Date.now(), mood:'', note:''
  });
  state.running = null; save();
  renderRunning(); renderAll();
}

// 今日心境 + 今日意圖（可改，記住今天的選擇，隔天重置）
const TODAY_MOODS = [
  { id:'calm', label:'平靜', emoji:'😌' }, { id:'tired', label:'疲憊', emoji:'😮‍💨' }, { id:'low', label:'低落', emoji:'😔' },
  { id:'expect', label:'期待', emoji:'✨' }, { id:'messy', label:'混亂', emoji:'😵‍💫' }, { id:'driven', label:'有動力', emoji:'💪' },
];
const TODAY_CARES = [
  { id:'rest', label:'休息', emoji:'🛌' }, { id:'focus', label:'專注', emoji:'🎯' }, { id:'emotion', label:'情緒', emoji:'💗' },
  { id:'body', label:'身體', emoji:'🌿' }, { id:'work', label:'工作節奏', emoji:'⏱️' }, { id:'social', label:'人際關係', emoji:'🤝' },
];
function getTodayState(){
  const today=dateKey(Date.now());
  if(!state.todayState || state.todayState.date!==today){
    state.todayState={ date:today, mood:null, cares:[] }; // 隔天重置
  }
  return state.todayState;
}
function renderTodayState(){
  const box=$('todayState'); if(!box) return;
  const ts=getTodayState();
  const moodBtns=TODAY_MOODS.map(m=>
    '<button class="ts-chip ts-chip-emoji'+(ts.mood===m.id?' on':'')+'" data-tsmood="'+m.id+'" title="'+m.label+'">'+m.emoji+'</button>').join('');
  const careBtns=TODAY_CARES.map(c=>
    '<button class="ts-chip'+(ts.cares.includes(c.id)?' on':'')+'" data-tscare="'+c.id+'"><span class="ts-emoji">'+c.emoji+'</span>'+c.label+'</button>').join('');
  box.innerHTML=
    '<div class="ts-block"><div class="ts-label">今天的心境</div><div class="ts-chips">'+moodBtns+'</div></div>'+
    '<div class="ts-block"><div class="ts-label">今天想照顧</div><div class="ts-chips">'+careBtns+'</div></div>';
  box.querySelectorAll('[data-tsmood]').forEach(b=>{
    b.onclick=()=>{ const ts=getTodayState(); ts.mood = (ts.mood===b.dataset.tsmood)?null:b.dataset.tsmood; save(); renderTodayState(); };
  });
  box.querySelectorAll('[data-tscare]').forEach(b=>{
    b.onclick=()=>{ const ts=getTodayState(); const id=b.dataset.tscare;
      const i=ts.cares.indexOf(id); if(i>=0)ts.cares.splice(i,1); else ts.cares.push(id);
      save(); renderTodayState(); };
  });
}
function renderToday(){
  const today = dateKey(Date.now());
  const list = state.entries.filter(e=>dateKey(e.start)===today).sort((a,b)=>b.start-a.start);
  const box = $('todayList');
  if(!list.length && !state.running){
    box.innerHTML = '<div class="empty">還沒有記錄。<br>在上面打一句話，按「開始」就會記下時間。</div>';
    return;
  }
  const todayCount = list.length;
  let head = '今天';
  if(todayCount>0) head = '今天 · 第 '+todayCount+' 個片刻';
  box.innerHTML = '<div class="sect-title">'+head+'</div>' + list.map(entryRow).join('');
  bindEntryRows();
}
// 今日待辦提醒：顯示今天尚未完成的排程，時間到/過期者醒目
function renderTodaySchedule(){
  const box=$('todaySchedule'); if(!box) return;
  const today=dateKey(Date.now());
  const items=(state.schedules||[]).filter(s=>s.date===today && !s.done)
    .sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  if(!items.length){ box.innerHTML=''; return; }
  const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes();
  box.innerHTML='<div class="sect-title">今天的待辦</div>'+items.map(s=>{
    let due=false;
    if(s.time){ const [h,m]=s.time.split(':').map(Number); if(h*60+m<=nowMin) due=true; }
    return '<div class="todo-card '+(due?'due':'')+'" data-sid="'+s.id+'">'+
      '<div class="todo-info"><div class="todo-text">'+esc(s.text)+'</div>'+
      '<div class="todo-time">'+(s.time?('預定 '+s.time+(due?' · 時間到了':'')):'今天')+'</div></div>'+
      '<div class="todo-acts">'+
        '<button class="btn sm" data-act="start" data-sid="'+s.id+'">開始</button>'+
        '<button class="btn ghost sm" data-act="retime" data-sid="'+s.id+'">改時間</button>'+
        '<button class="btn ghost sm" data-act="cancel" data-sid="'+s.id+'">取消</button>'+
      '</div></div>';
  }).join('');
  box.querySelectorAll('[data-act]').forEach(b=>{
    const sid=b.dataset.sid; const act=b.dataset.act;
    b.onclick=()=>{
      if(act==='start'){ startFromSchedule(sid); }
      else if(act==='cancel'){ const s=state.schedules.find(x=>x.id===sid); if(s){ s.done=true; save(); renderTodaySchedule(); } }
      else if(act==='retime'){
        const s=state.schedules.find(x=>x.id===sid); if(!s) return;
        const nt=prompt('改成幾點？（格式 HH:MM，例如 14:30）', s.time||'');
        if(nt!==null){ s.time=nt.trim(); save(); renderTodaySchedule(); }
      }
    };
  });
}
function entryRow(e){
  const cat = catById(e.cat);
  const dur = e.end ? fmtDur(e.end-e.start) : '進行中';
  return '<div class="entry" data-id="'+e.id+'">'+
    '<span class="dot" style="background:'+cat.hex+'"></span>'+
    '<div class="body">'+
      '<div class="t1">'+esc(e.text)+' '+(e.mood||'')+'</div>'+
      '<div class="t2">'+fmtTime(e.start)+'–'+(e.end?fmtTime(e.end):'…')+' · '+cat.name+(e.note?' · '+esc(e.note):'')+'</div>'+
    '</div>'+
    '<span class="estar '+(e.star?'on':'')+'" data-star="'+e.id+'">'+(e.star?'★':'☆')+'</span>'+
    '<span class="dur">'+dur+'</span>'+
  '</div>';
}

function aggregate(entries){
  const sum = {}; let total=0;
  entries.forEach(e=>{ if(!e.end) return; const d=e.end-e.start; sum[e.cat]=(sum[e.cat]||0)+d; total+=d; });
  return { sum, total };
}
function pieSVG(sum, total){
  if(total<=0) return '';
  let acc=0; const R=52, C=2*Math.PI*R; let segs='';
  CATS.forEach(cat=>{
    const v = sum[cat.id]||0; if(!v) return;
    const frac = v/total;
    const len = frac*C;
    segs += '<circle r="'+R+'" cx="64" cy="64" fill="none" stroke="'+cat.hex+'" stroke-width="20" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-acc*C)+'" transform="rotate(-90 64 64)"/>';
    acc += frac;
  });
  return '<svg width="128" height="128" viewBox="0 0 128 128">'+segs+'<circle r="32" cx="64" cy="64" fill="var(--card)"/></svg>';
}
function renderPieInto(elId, entries){
  const agg = aggregate(entries);
  const sum=agg.sum, total=agg.total;
  const el = $(elId);
  if(total<=0){ el.innerHTML = '<div class="empty" style="padding:20px">這段期間沒有已完成的記錄</div>'; return; }
  const rows = CATS.filter(c=>sum[c.id]).sort((a,b)=>sum[b.id]-sum[a.id]).map(c=>{
    const pct = (sum[c.id]/total*100).toFixed(1);
    return '<div class="lrow"><span class="ldot" style="background:'+c.hex+'"></span>'+c.name+
      '<span class="lpct">'+pct+'% · '+fmtDur(sum[c.id])+'</span></div>';
  }).join('');
  el.innerHTML = '<div class="pie-wrap">'+pieSVG(sum,total)+'<div class="legend">'+rows+'</div></div>';
}

// 心情 emoji → 高度分數（😊=5 開心 ... 😫=1 低落）
const MOOD_SCORE = { '😊':5, '🙂':4, '😐':3, '😕':2, '😫':1 };
function renderMoodWeek(){
  const box=$('moodWeek'); if(!box) return;
  const ws=startOfWeek(new Date());
  const wd=['一','二','三','四','五','六','日'];
  const todayKey=dateKey(Date.now());
  // 心情表情列
  let faces='';
  // 24小時時間軸列（每天一直條，0點在底、24點在頂）
  let cols='';
  for(let i=0;i<7;i++){
    const day=new Date(ws); day.setDate(day.getDate()+i);
    const k=dateKey(day.getTime());
    const isToday=(k===todayKey);
    const dayStart=new Date(day); dayStart.setHours(0,0,0,0);
    const dayStartMs=dayStart.getTime();
    const dayEnts=state.entries.filter(e=>e.end && dateKey(e.start)===k);
    // 心情
    const moods=dayEnts.filter(e=>e.mood && MOOD_SCORE[e.mood]).map(e=>MOOD_SCORE[e.mood]);
    let face='·';
    if(moods.length){ const avg=moods.reduce((a,b)=>a+b,0)/moods.length;
      face=Object.keys(MOOD_SCORE).reduce((p,c)=>Math.abs(MOOD_SCORE[c]-avg)<Math.abs(MOOD_SCORE[p]-avg)?c:p); }
    faces+='<div class="tl-face'+(isToday?' today':'')+'">'+face+'</div>';
    // 每筆記錄定位在 24 小時軸上
    let segs='';
    dayEnts.forEach(e=>{
      const startH=Math.max(0,(e.start-dayStartMs)/3600000);
      let endH=(e.end-dayStartMs)/3600000; if(endH>24)endH=24;
      if(endH<=startH) return;
      const bottom=startH/24*100;
      const height=Math.max((endH-startH)/24*100,1.2);
      segs+='<i style="bottom:'+bottom+'%;height:'+height+'%;background:'+catById(e.cat).hex+'" title="'+esc(e.text)+'" data-id="'+e.id+'"></i>';
    });
    cols+='<div class="tl-col'+(isToday?' today':'')+'" data-k="'+k+'"><div class="tl-track">'+segs+'</div><span class="tl-day">'+wd[i]+'</span></div>';
  }
  box.innerHTML=
    '<div class="tl-faces">'+faces+'</div>'+
    '<div class="tl-chart">'+
      '<div class="tl-scale"><span>24</span><span>18</span><span>12</span><span>6</span><span>0</span></div>'+
      '<div class="tl-cols">'+cols+'</div>'+
    '</div>'+
    '<div class="mw-legend">直條是一天 0–24 點，色塊是各時段的記錄；上方是當天心情。點任一天看記錄。</div>';

/* ===== 本週月相（真實天文計算） ===== */
function moonPhase(date){
  // 以已知新月(2000-01-06 18:14 UTC)為基準，朔望月 29.53059 天
  const synodic=29.530588853;
  const ref=Date.UTC(2000,0,6,18,14,0)/86400000;
  const now=date.getTime()/86400000;
  let age=((now-ref)%synodic); if(age<0)age+=synodic;
  return age/synodic; // 0=新月 0.5=滿月
}
function moonGlyph(p){
  // 回傳一個概略月相符號
  if(p<0.0625||p>=0.9375)return '🌑';
  if(p<0.1875)return '🌒'; if(p<0.3125)return '🌓'; if(p<0.4375)return '🌔';
  if(p<0.5625)return '🌕'; if(p<0.6875)return '🌖'; if(p<0.8125)return '🌗'; return '🌘';
}
function renderMoonWeek(){
  const box=$('moonWeek'); if(!box) return;
  const ws=startOfWeek(new Date());
  const wd=['一','二','三','四','五','六','日'];
  const todayKey=dateKey(Date.now());
  let cells='';
  for(let i=0;i<7;i++){
    const day=new Date(ws); day.setDate(day.getDate()+i);
    const isToday=dateKey(day.getTime())===todayKey;
    const g=moonGlyph(moonPhase(day));
    cells+='<div class="moon-col'+(isToday?' today':'')+'"><span class="moon-g">'+g+'</span><span class="moon-d">'+wd[i]+'</span></div>';
  }
  box.innerHTML='<div class="moon-row">'+cells+'</div>';
}

function renderWeekInsight(){

  const moods=ents.filter(e=>e.mood&&MOOD_SCORE[e.mood]).map(e=>MOOD_SCORE[e.mood]);
  const moodAvg=moods.length?moods.reduce((a,b)=>a+b,0)/moods.length:0;
  const doneSteps=state.plans.reduce((n,p)=>n+(p.tasks?p.tasks.filter(t=>t.doneAt&&t.doneAt>=ws).length:0),0);
  const stars=ents.filter(e=>e.star).length;
  // 時間黑洞
  const agg=aggregate(ents); let blackTop=null;
  if(agg.total>0){ const goalCats=new Set(state.goals.map(g=>g.cat));
    const f=CATS.filter(c=>agg.sum[c.id]&&(agg.sum[c.id]/agg.total)>=0.25&&!goalCats.has(c.id)&&c.id!=='sleep'&&c.id!=='work');
    if(f.length) blackTop=f[0].name;
  }
  let lines=[];
  if(moodAvg>=4) lines.push('這週你的心情大致是穩定的，也記得繼續為自己留點空間。');
  else if(moodAvg>0&&moodAvg<2.5) lines.push('這週有幾天比較低落，辛苦了。下週可以先把節奏放慢一點。');
  else if(moodAvg>0) lines.push('這週的心情有高有低，能好好記下來，就已經是在照顧自己了。');
  if(doneSteps>0) lines.push('你完成了 '+doneSteps+' 個小步驟，這些累積都算數。');
  if(stars>0) lines.push('還留下了 '+stars+' 個值得記住的片刻，值得回味。');
  if(blackTop) lines.push('「'+blackTop+'」這週佔的時間不少，下週想調整的話，可以先從一個小行動開始。');
  if(lines.length===0) lines.push('這週你記錄了 '+recN+' 筆，謝謝你願意好好看見自己的生活。');
  box.innerHTML='<div class="insight">'+lines.join('<br>')+'</div>';
}

function fmtDate(ts){ const d=new Date(ts); const wd=['日','一','二','三','四','五','六'][d.getDay()]; return (d.getMonth()+1)+'/'+d.getDate()+'（'+wd+'）'; }

function goalProgress(g){
  const s=startOfWeek(new Date()).getTime();
  const wkEnts = state.entries.filter(e=>e.end && e.start>=s);
  let current=0, unit='';
  if(g.type==='hours'){ const ms=wkEnts.filter(e=>e.cat===g.cat).reduce((a,e)=>a+(e.end-e.start),0); current=ms/3600000; unit='小時'; }
  else if(g.type==='count'){ current=wkEnts.filter(e=>e.cat===g.cat).length; unit='次'; }
  else { const agg=aggregate(wkEnts); current = agg.total? (agg.sum[g.cat]||0)/agg.total*100 : 0; unit='%'; }
  let pct, done;
  if(g.dir==='gte'){ pct=g.target? Math.min(current/g.target*100,100):0; done=current>=g.target; }
  else { pct = g.target? Math.min(current/g.target*100,100):0; done=current<=g.target; }
  return { current, unit, pct, done };
}
function renderGoals(){
  const box = $('goalList');
  if(!state.goals.length){ box.innerHTML = '<div class="empty">還沒有目標。<br>按下方按鈕設定第一個。<br><br>支援三種：時數、次數、比例。</div>'; return; }
  box.innerHTML = state.goals.map(g=>{
    const p = goalProgress(g);
    const cat = catById(g.cat);
    const typeName = {hours:'每週時數', count:'每週次數', ratio:'時間比例'}[g.type];
    const dirSym = g.dir==='gte'?'≥':'≤';
    const cur = g.type==='hours'? p.current.toFixed(1) : g.type==='ratio'? p.current.toFixed(0) : p.current;
    const streak = g.streak||0;
    return '<div class="goal '+(p.done?'done':'')+'" data-id="'+g.id+'">'+
      '<div class="gtop"><div>'+
        '<div class="gname"><span class="dot" style="background:'+cat.hex+';display:inline-block;margin-right:6px"></span>'+cat.name+' '+dirSym+' '+g.target+p.unit+'</div>'+
        '<div class="gtype">'+typeName+' · '+(p.done?'已達成 ✓':'進行中')+'</div>'+
      '</div>'+
      '<button class="del" data-del="'+g.id+'">×</button></div>'+
      '<div class="progress"><i style="width:'+p.pct.toFixed(0)+'%"></i></div>'+
      '<div class="gval" style="margin-top:6px">目前 '+cur+p.unit+' / 目標 '+dirSym+' '+g.target+p.unit+'</div>'+
      (streak>0?'<div class="gstreak">🔥 連續達標 '+streak+' 週</div>':'')+
    '</div>';
  }).join('');
  document.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = (ev)=>{ ev.stopPropagation(); if(confirm('刪除這個目標？')){ state.goals=state.goals.filter(g=>g.id!==b.dataset.del); save(); renderGoals(); } };

  study:   ['學','讀','書','看書','背','考','課','進修','英文','日文','語言','技能','專注','作業','論文','知識','成長','學習'],

};
function classifyWish(text){
  const t = text.toLowerCase();
  let best='other', score=0;
  for(const k in WISH_KEYWORDS){
    let s=0; for(const w of WISH_KEYWORDS[k]){ if(t.includes(w)) s+=w.length; }
    if(s>score){ score=s; best=k; }
  }
  return best;
}

function isProjectWish(text){
  const t=text.toLowerCase();
  return PROJECT_SIGNALS.some(w=>t.includes(w.toLowerCase()));
}

let _lastWish = { text:'', cat:'other', mode:'habit' };
function suggestPlans(){
  const input=$('wishInput'); const text=input.value.trim();
  if(!text) return;
  const cat=classifyWish(text);
  const mode= isProjectWish(text) ? 'project' : 'habit';
  _lastWish = { text, cat, mode };
  renderWishResult();
}
function renderWishResult(){
  const { text, cat, mode } = _lastWish;
  const box=$('wishResult');
  const switchLine = mode==='habit'
    ? '<div class="wish-switch">這比較像「想完成的一件事」嗎？<button id="switchMode">切換成專案型</button></div>'
    : '<div class="wish-switch">這比較像「想養成的習慣」嗎？<button id="switchMode">切換成習慣型</button></div>';

  if(mode==='habit'){
    const pool=[...PLAN_BANK[cat]];
    const picks=[];
    while(picks.length<3 && pool.length){ picks.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]); }
    box.innerHTML='<div class="wish-sub" style="margin-top:14px;margin-bottom:4px;">我聽見了「'+esc(text)+'」，這是個想養成的習慣 — 挑幾個溫柔的小步驟試試：</div>'+
      picks.map(p=>'<div class="plan-opt" data-plan="'+esc(p)+'"><span class="pick"></span><span>'+esc(p)+'</span></div>').join('')+
      switchLine;
    box.querySelectorAll('.plan-opt').forEach(el=>{
      el.onclick=()=>{ addPlanTask(text, cat, 'habit', el.dataset.plan); el.classList.add('added'); el.querySelector('.pick').textContent='✓'; };
    });
  } else {
    box.innerHTML='<div class="wish-sub" style="margin-top:14px;margin-bottom:8px;">我聽見了「'+esc(text)+'」，這像是一件想完成的事 — 把它拆成幾個步驟，一步步推進：</div>'+
      '<div class="input-row"><input id="stepInput" placeholder="加一個步驟，例如「列出需求」" autocomplete="off"><button class="btn" id="addStepBtn">加入</button></div>'+
      '<div class="wish-sub" style="margin-top:8px;">想不到？這些通用步驟給你參考：<br>釐清想完成的樣子 · 拆成 3 小塊 · 先做最小的一塊 · 完成後檢視調整</div>'+
      switchLine;
    const addStep=()=>{
      const si=$('stepInput'); const st=si.value.trim(); if(!st) return;
      addPlanTask(text, cat, 'project', st); si.value=''; si.focus();
    };
    $('addStepBtn').onclick=addStep;
    $('stepInput').addEventListener('keydown', e=>{ if(e.key==='Enter') addStep(); });
  }
  const sw=$('switchMode');
  if(sw) sw.onclick=()=>{ _lastWish.mode = mode==='habit'?'project':'habit'; renderWishResult(); };
}
function addPlanTask(wish, cat, mode, taskText){
  // 找有沒有同願望的計畫卡，沒有就建一張
  let plan=state.plans.find(p=>p.wish===wish && p.cat===cat && !p.archived);
  if(!plan){
    plan={ id:'p'+Date.now()+Math.random().toString(36).slice(2,5), wish, cat, mode:mode||'habit', tasks:[], created:Date.now() };
    state.plans.push(plan);
  }
  if(!plan.tasks.some(t=>t.text===taskText)){
    plan.tasks.push({ id:'t'+Date.now()+Math.random().toString(36).slice(2,5), text:taskText, done:false });
  }
  save(); renderActivePlans();
}
function toggleTask(planId, taskId){
  const plan=state.plans.find(p=>p.id===planId); if(!plan) return;
  const task=plan.tasks.find(t=>t.id===taskId); if(!task) return;
  task.done=!task.done;
  task.doneAt = task.done ? Date.now() : null;
  save();
  renderActivePlans();
  if(typeof renderKeepsakes==='function') renderKeepsakes();
  if(task.done){ showReward(planId); }
}
function delTask(planId, taskId){
  const plan=state.plans.find(p=>p.id===planId); if(!plan) return;
  plan.tasks=plan.tasks.filter(t=>t.id!==taskId);
  if(!plan.tasks.length) state.plans=state.plans.filter(p=>p.id!==planId);
  save(); renderActivePlans();
}
function showReward(planId){
  const card=document.querySelector('.plan-card[data-plan-id="'+planId+'"]');
  if(!card) return;
  const old=card.querySelector('.reward-box'); if(old) old.remove();
  const div=document.createElement('div');
  div.className='reward-box';
  div.textContent=pick(REWARDS);
  card.appendChild(div);
  setTimeout(()=>{ if(div.parentNode) div.style.opacity='0.6'; }, 4000);
}
function renderActivePlans(){
  const box=$('activePlans'); if(!box) return;
  const plans=state.plans.filter(p=>p.tasks.length);
  if(!plans.length){ box.innerHTML=''; return; }
  box.innerHTML='<div class="sect-title">我的行動計畫</div>'+plans.map(p=>{
    const done=p.tasks.filter(t=>t.done).length;
    const pct=Math.round(done/p.tasks.length*100);
    const isProj = p.mode==='project';
    const typeLabel = isProj ? '專案' : WISH_CAT_NAME[p.cat];
    const progress = isProj
      ? '<div class="progress" style="margin:8px 0"><i style="width:'+pct+'%"></i></div><div class="wish-sub" style="margin:0 0 6px">完成度 '+pct+'%（'+done+'/'+p.tasks.length+'）</div>'
      : '';
    return '<div class="plan-card" data-plan-id="'+p.id+'">'+
      '<div class="pc-head"><span class="pc-wish">願望：'+esc(p.wish)+'</span>'+
      '<span class="wish-sub" style="margin:0">'+typeLabel+' · '+done+'/'+p.tasks.length+'</span></div>'+
      progress+
      p.tasks.map(t=>'<div class="plan-task '+(t.done?'done':'')+'" data-task="'+t.id+'">'+
        '<span class="tick" data-act="toggle">'+(t.done?'✓':'')+'</span>'+
        '<span class="tlabel" data-act="toggle">'+esc(t.text)+'</span>'+
        '<button class="plan-del" data-act="del">×</button></div>').join('')+
      (isProj ? '<div class="plan-addstep"><input class="stepAdd" data-plan="'+p.id+'" placeholder="再加一個步驟…" autocomplete="off"></div>' : '')+
    '</div>';
  }).join('');
  box.querySelectorAll('.stepAdd').forEach(inp=>{
    inp.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ const v=inp.value.trim(); if(!v) return; const p=state.plans.find(x=>x.id===inp.dataset.plan); if(p){ addPlanTask(p.wish,p.cat,'project',v); } }
    });
  });
  box.querySelectorAll('.plan-card').forEach(card=>{
    const pid=card.dataset.planId;
    card.querySelectorAll('.plan-task').forEach(row=>{
      const tid=row.dataset.task;
      row.querySelectorAll('[data-act="toggle"]').forEach(el=> el.onclick=()=>toggleTask(pid,tid));
      const del=row.querySelector('[data-act="del"]'); if(del) del.onclick=()=>delTask(pid,tid);
    });
  });
}

    '<div class="muse-horo-row"><span class="muse-horo-label">工作</span>'+esc(_horoPick(ZODIAC_LINES.work,seed,'w'))+'</div>'+
    '<div class="muse-horo-row"><span class="muse-horo-label">小行動</span>'+esc(_horoPick(ZODIAC_LINES.action,seed,'a'))+'</div>'+
    '<div class="muse-horo-foot">適合照顧：'+_horoPick(ZODIAC_LINES.care,seed,'c')+'　僅供參考，給你一個今天的方向</div>'+
    '<button class="muse-horo-others" id="horoViewOther">看其他星座</button>';
}
function museCardHTML(key, withMeta){
  let inner='';
  if(key==='word'){ inner='<div class="muse-big">'+esc(pick(MUSE_WORDS))+'</div>'; }
  else if(key==='guide'){ inner='<div class="muse-big">'+esc(pick(MUSE_GUIDES))+'</div>'; }
  else if(key==='tarot'){
    const t=pick(MUSE_TAROT);
    const reversed = Math.random()<0.5;
    const posLabel = reversed ? '逆位' : '正位';
    const meaning = reversed ? t.rev : t.up;
    const hint = reversed ? t.revHint : t.hint;
    inner='<div class="muse-tarot-name'+(reversed?' reversed':'')+'">'+esc(t.name)+'</div>'+
      '<div class="muse-tarot-pos">'+posLabel+'</div>'+
      '<div class="muse-tarot-up">'+esc(meaning)+'</div>'+
      '<div class="muse-tarot-hint">'+esc(hint)+'</div>';
  }
  else if(key==='quiz'){
    inner='<div class="muse-quiz-q">'+esc(MUSE_QUIZ.q)+'</div><div class="muse-quiz-opts">'+
      MUSE_QUIZ.opts.map((o,i)=>'<button class="muse-quiz-opt" data-qi="'+i+'">'+esc(o.label)+'</button>').join('')+
      '</div><div class="muse-quiz-result" id="museQuizResult"></div>';
  }
  else if(key==='calm'){
    const c=pick(MUSE_CALM);
    inner='<div class="muse-calm-name">'+esc(c.name)+'</div><div class="muse-calm-steps">'+esc(c.steps)+'</div>';
  }
  else if(key==='horoscope'){
    inner=horoscopeHTML();
  }
  const meta = MUSE_META[Object.keys(MUSE_META).find(m=>MUSE_META[m].key===key)];
  const head = withMeta && meta ? '<div class="muse-card-head"><span class="muse-card-title">'+meta.title+'</span><span class="muse-card-sub">'+meta.sub+'</span></div>' : '';
  // 星座的選星座/看其他選單階段，不顯示「再來一次」
  const hideAgain = (key==='horoscope' && (!_museZodiac || _horoView==='picking'));
  const again = hideAgain ? '' : '<button class="muse-again" data-key="'+key+'">再來一次</button>';
  return '<div class="muse-card">'+head+inner+again+'</div>';
}
function bindMuseCard(scope){
  // 再來一次
  scope.querySelectorAll('.muse-again').forEach(b=>{
    b.onclick=()=>{ renderMuse(); };
  });
  // 選自己的星座（data-zid）
  scope.querySelectorAll('.muse-zodiac-opt[data-zid]').forEach(b=>{
    b.onclick=()=>{ _museZodiac=b.dataset.zid; _horoView=null; try{localStorage.setItem('life_tracker_zodiac',_museZodiac);}catch(e){} renderMuse(); };
  });
  // 選要看的其他星座（data-vzid）
  scope.querySelectorAll('.muse-zodiac-opt[data-vzid]').forEach(b=>{
    b.onclick=()=>{ _horoView=b.dataset.vzid; renderMuse(); };
  });
  // 看其他星座入口
  const vo=scope.querySelector('#horoViewOther');
  if(vo) vo.onclick=()=>{ _horoView='picking'; renderMuse(); };
  // 回到我的星座（從看其他選單）
  const bs=scope.querySelector('#horoBackSelf');
  if(bs) bs.onclick=()=>{ _horoView=null; renderMuse(); };
  // 換星座 / 回到我的（運勢標題列按鈕）
  const zc=scope.querySelector('#zodiacChange');
  if(zc) zc.onclick=()=>{
    if(_horoView){ _horoView=null; renderMuse(); } // 看其他時→回到我的
    else { _museZodiac=null; try{localStorage.removeItem('life_tracker_zodiac');}catch(e){} renderMuse(); } // 看自己時→重選
  };
  // 測驗選項：選完選項消失，只留「你的選擇 + 結果」
  scope.querySelectorAll('.muse-quiz-opt').forEach(b=>{
    b.onclick=()=>{
      const i=+b.dataset.qi;
      const opt=MUSE_QUIZ.opts[i];
      const opts=scope.querySelector('.muse-quiz-opts');
      const res=$('museQuizResult');
      if(opts){ opts.style.transition='opacity 0.4s ease'; opts.style.opacity='0'; }
      setTimeout(()=>{
        if(opts) opts.remove();
        if(res){
          res.innerHTML='<div class="muse-quiz-pick">你選了：'+esc(opt.label)+'</div>'+esc(opt.result);
          res.style.display='block';
          res.classList.add('muse-reveal');
        }
      }, 420);
    };
  });
}

function computeWeekReview(){
  const s = startOfWeek(new Date()).getTime();
  const ents = state.entries.filter(e=>e.start>=s);
  const moments = ents.length;
  // 最常做的分類
  const catCount = {};
  ents.forEach(e=>{ catCount[e.cat]=(catCount[e.cat]||0)+1; });
  let topCat=null, topN=0;
  for(const c in catCount){ if(catCount[c]>topN){ topN=catCount[c]; topCat=c; } }
  // 心情傾向（mood 是 emoji，取最常出現）
  const moodCount = {};
  ents.forEach(e=>{ if(e.mood){ moodCount[e.mood]=(moodCount[e.mood]||0)+1; } });
  let topMood=null, topMoodN=0;
  for(const m in moodCount){ if(moodCount[m]>topMoodN){ topMoodN=moodCount[m]; topMood=m; } }
  // 本週完成的計畫步驟
  let planDone=0, planTotal=0;
  (state.plans||[]).forEach(p=>{ p.tasks.forEach(t=>{ planTotal++; if(t.done) planDone++; }); });
  return { moments, topCat, topCatName: topCat?catById(topCat).name:null, topMood, planDone, planTotal };
}
function renderWeekReviewCard(){
  const box=$('weekReviewCard'); if(!box) return;
  const day=new Date().getDay(); // 0=日 6=六
  const isWeekend = (day===6 || day===0);
  const r=computeWeekReview();
  if(!isWeekend || r.moments===0){ box.innerHTML=''; return; }
  box.innerHTML='<div class="review-hint" id="reviewHint">'+
    '<div class="rh-text"><div class="rh-title">這週的回顧</div>'+
    '<div class="rh-sub">看看本週值得記住的片刻 →</div></div></div>';
  $('reviewHint').onclick=()=>{ switchView('track'); };
}
function currentSlot(){
  const h = new Date().getHours();
  if(h>=5 && h<11) return 'dawn';
  if(h>=11 && h<17) return 'day';
  if(h>=17 && h<20) return 'dusk';
  return 'night';
}
function getAmbientMode(){
  try{ return localStorage.getItem(AMBIENT_KEY) || 'auto'; }catch(e){ return 'auto'; }
}
let _ambientGreetCache = { slot:null, text:'' };
function applyAmbient(){
  const mode = getAmbientMode();
  let slot;
  if(mode==='day') slot='day';
  else if(mode==='night') slot='night';
  else slot=currentSlot();
  document.documentElement.setAttribute('data-time', slot);
  const g = GREETINGS[slot];
  if($('ambientTime')) $('ambientTime').textContent = g.time;
  if($('ambientDate')){
    const now=new Date();
    const wd=['日','一','二','三','四','五','六'][now.getDay()];
    $('ambientDate').textContent = (now.getMonth()+1)+'月'+now.getDate()+'日 · 星期'+wd;
  }
  // 問候語只在時段改變時換一句，避免每分鐘跳動
  if(_ambientGreetCache.slot !== slot){
    _ambientGreetCache = { slot, text: pick(g.greets) };
  }
  if($('ambientGreet')) $('ambientGreet').textContent = _ambientGreetCache.text;
  document.querySelectorAll('#ambientTabs button').forEach(b=>{
    b.classList.toggle('on', b.dataset.amb===mode);
  });
}
function setAmbientMode(m){
  try{ localStorage.setItem(AMBIENT_KEY, m); }catch(e){}
  applyAmbient();
}
applyAmbient();
setInterval(applyAmbient, 60000);
document.querySelectorAll('#ambientTabs button').forEach(b=>{
  b.onclick = ()=> setAmbientMode(b.dataset.amb);
});

$('themeBtn').onclick = ()=>{ renderThemeGrid(); renderSetPartner(); applyAmbient(); $('themeModal').classList.add('on'); };
$('exportData').onclick = ()=>{
  try{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=url; a.download='心靈軌跡備份_'+dateKey(Date.now())+'.json'; a.click();
    URL.revokeObjectURL(url);
  }catch(e){ alert('匯出失敗，請稍後再試'); }
};
$('themeClose').onclick = ()=> $('themeModal').classList.remove('on');
$('themeModal').onclick = e=>{ if(e.target.id==='themeModal') $('themeModal').classList.remove('on'); };

/* ============ 初次設定（最多3步，輕量可跳過） ============ */
let _onbStep = 0;
let _onbPick = { partner:null, theme:null, cares:[] };
const ONB_CARES = [
  { id:'rest', label:'好好休息' },
  { id:'body', label:'照顧身體' },
  { id:'study', label:'學習成長' },
  { id:'emotion', label:'安頓情緒' },
  { id:'work', label:'工作節奏' },
  { id:'social', label:'人際關係' },
];
function startOnboarding(){
  _onbStep = 0;
  _onbPick = { partner:null, theme:null, cares:[] };
  $('onbScreen').classList.add('on');
  renderOnbStep();
}
function finishOnboarding(){
  if(_onbPick.partner) state.partner = _onbPick.partner;
  if(_onbPick.theme) applyTheme(_onbPick.theme);
  state.onboarded = true;
  save();
  $('onbScreen').classList.remove('on');
  renderAll();
}
function renderOnbStep(){
  const prog=$('onbProgress'); const body=$('onbBody');
  if(prog) prog.innerHTML = [0,1,2].map(i=>'<span class="onb-dot '+(i===_onbStep?'on':'')+'"></span>').join('');
  if(_onbStep===0){
    body.innerHTML = '<div class="onb-h">先選一位同行夥伴</div>'+
      '<div class="onb-sub">他會用自己的方式陪你記錄、給你回應。之後隨時能換。</div>'+
      '<div class="onb-partners">'+PARTNERS.map(p=>
        '<button class="onb-partner '+(_onbPick.partner===p.id?'on':'')+'" data-pid="'+p.id+'">'+
        '<span class="onb-pemoji">'+p.emoji+'</span><span class="onb-pname">'+p.zh+'</span><span class="onb-psub">'+p.sub.split(' · ')[0]+'</span></button>'
      ).join('')+'</div>'+
      onbNav(true);
    body.querySelectorAll('.onb-partner').forEach(b=>{
      b.onclick=()=>{ _onbPick.partner = (_onbPick.partner===b.dataset.pid?null:b.dataset.pid); renderOnbStep(); };
    });
  } else if(_onbStep===1){
    body.innerHTML = '<div class="onb-h">挑一個喜歡的氛圍</div>'+
      '<div class="onb-sub">選一個此刻順眼的色調，之後也能在主題裡換。</div>'+
      '<div class="onb-themes">'+THEMES.map(t=>
        '<button class="onb-theme '+(_onbPick.theme===t.id?'on':'')+'" data-tid="'+t.id+'">'+
        '<span class="onb-sw">'+t.sw.map(c=>'<i style="background:'+c+'"></i>').join('')+'</span>'+
        '<span class="onb-tname">'+t.name+'</span></button>'
      ).join('')+'</div>'+
      onbNav(true);
    body.querySelectorAll('.onb-theme').forEach(b=>{
      b.onclick=()=>{ _onbPick.theme=b.dataset.tid; applyTheme(b.dataset.tid); renderOnbStep(); };
    });
  } else {
    body.innerHTML = '<div class="onb-h">最近，最想照顧自己哪一塊？</div>'+
      '<div class="onb-sub">可以選幾個，也可以先跳過。這只是幫你起個頭。</div>'+
      '<div class="onb-cares">'+ONB_CARES.map(c=>
        '<button class="onb-care '+(_onbPick.cares.includes(c.id)?'on':'')+'" data-cid="'+c.id+'">'+c.label+'</button>'
      ).join('')+'</div>'+
      onbNav(false, true);
    body.querySelectorAll('.onb-care').forEach(b=>{
      b.onclick=()=>{
        const id=b.dataset.cid;
        if(_onbPick.cares.includes(id)) _onbPick.cares=_onbPick.cares.filter(x=>x!==id);
        else _onbPick.cares.push(id);
        renderOnbStep();
      };
    });
  }
  const back=$('onbBack'); if(back) back.onclick=()=>{ if(_onbStep>0){ _onbStep--; renderOnbStep(); } };
  const next=$('onbNext'); if(next) next.onclick=()=>{ if(_onbStep<2){ _onbStep++; renderOnbStep(); } else { finishOnboarding(); } };
  const skip=$('onbSkip'); if(skip) skip.onclick=()=> finishOnboarding();
}
function onbNav(showSkip, isLast){
  return '<div class="onb-nav">'+
    (_onbStep>0?'<button class="btn ghost sm" id="onbBack">上一步</button>':'<span></span>')+
    (showSkip?'<button class="onb-skip" id="onbSkip">先略過</button>':'')+
    '<button class="btn sm" id="onbNext">'+(isLast?'開始使用':'下一步')+'</button>'+
  '</div>';
}

try{ _museZodiac = localStorage.getItem('life_tracker_zodiac') || null; }catch(e){}
renderAll();
if(!state.onboarded){ startOnboarding(); }
